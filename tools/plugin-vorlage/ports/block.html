<div class="port-block" id="portBlock">
  <div class="grid">
    <label class="field" style="max-width: 16rem"><span data-pb="pbLabel">{pbLabel}</span>
      <input id="pbInput" type="number" min="1024" max="65535" step="1" inputmode="numeric" placeholder="">
    </label>
  </div>
  <p class="status" id="pbNote"></p>
  <p><button type="button" class="secondary" id="pbBack" hidden></button></p>
  <p class="hint" data-pb="pbHint">{pbHint}</p>
  <p class="hint" data-pb="pbWebLogin">{pbWebLogin}</p>
</div>
